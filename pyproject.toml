[project]
name = "utf8-api"
version = "1.1.0"
description = "A strict UTF-8, Unicode, and JSON analysis API."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.1",
  # Transitive floor pins for known CVEs; keep even if a direct dependency
  # would otherwise resolve them higher.
  "starlette>=1.3.1",  # CVE-2026-48710 (Host header bypass), CVE-2026-54283 (form-limits DoS)
  "h11>=0.16.0",  # CVE-2025-43859 (request smuggling)
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  # Known-good pin; maintainers should verify and bump Ruff before the first release.
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
